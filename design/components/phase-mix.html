  <section class="specimen" aria-label="Phase mix bar and legend: Bar">

      <div class="mix-demo"><div class="mix" title="plan 17%, spec 43%, design 3%, build 17%, review 10%, merge 5%, other 5%"><span class="p-plan w17"></span><span class="p-spec w43"></span><span class="p-design w3"></span><span class="p-build w17"></span><span class="p-review w10"></span><span class="p-merge w5"></span><span class="p-other w5"></span></div></div>

    </div>
  </section>

      <section class="panel" aria-label="Legend"><div class="legend"><span><i class="p-plan"></i>plan</span><span><i class="p-spec"></i>spec</span><span><i class="p-design"></i>design</span><span><i class="p-build"></i>build</span><span><i class="p-review"></i>review</span><span><i class="p-merge"></i>merge</span><span><i class="p-other"></i>other</span></div></section>
